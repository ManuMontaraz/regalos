		<meta name="viewport" content="width=device-width, initial-scale=1">

		<title>REGALOS MONTARAZ</title>

		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">

	<body>
		<div id="containerForm">
			<form id="giftForm">
				<div id="contentForm">
					
					<div class="portrait">
						<img id="image_game" src="">
						<ul id="search_game"></ul>
					</div>

					<div class="input" onchange="search_games()" onfocus="document.querySelector('#search_game').classList.add('active')">
						<label for="name">Nombre del juego</label>
						<input type="text" id="name" name="name" value="" placeholder="nombre">
					</div>
					
					<div class="input" oninput="update_image()">
						<label for="image">Imagen del juego</label>
						<input type="text" id="image" name="image" value="" placeholder="url de la imagen">
					</div>
					
					<div class="input">
						<label for="key">Clave del juego</label>
						<input type="text" id="key" name="key" value="" placeholder="clave">
					</div>

					<button id="buttonSendGift">CREAR REGALO</button>
				</div>
			</form>
		</div>
